format = 1
min_app_version = "0.2.0"
name = "Raspberry Pi 5"
description = "Gentoo for Raspberry Pi 5: CPU tuned stages, boot configuration, zram swap and optional GNOME or KDE Plasma desktop."
groups_title = "Software"
architecture = "arm64"

[[variables]]
id = "init"
title = "Init system"
description = "Services of stage4 are enabled automatically with OpenRC."
default = "openrc"
options = [
    { value = "openrc", title = "OpenRC" },
    { value = "systemd", title = "systemd" },
]

[[variables]]
id = "optimization"
title = "CPU optimization"
default = "tuned"
options = [
    { value = "tuned", title = "Tuned for Cortex-A76" },
    { value = "lto", title = "Tuned for Cortex-A76, with LTO" },
    { value = "generic", title = "Generic arm64" },
]

[[variables]]
id = "desktop"
title = "Desktop"
description = "Desktop stages are built next to the console stage4, from desktop stage3."
default = "none"
options = [
    { value = "none", title = "None" },
    { value = "gnome", title = "GNOME" },
    { value = "plasma", title = "KDE Plasma" },
]

[[variables]]
id = "boot_device"
title = "Root filesystem"
description = "Device with root partition (second partition), used in cmdline.txt."
default = "sd"
options = [
    { value = "sd", title = "microSD card" },
    { value = "nvme", title = "NVMe drive (M.2 HAT)" },
    { value = "usb", title = "USB drive" },
]

[[variables]]
id = "pcie_gen3"
title = "PCIe Gen 3"
description = "Faster NVMe drives. Not officially certified, some drives and HATs are unstable with it."
type = "boolean"
default = false
when = "boot_device == 'nvme'"

[[variables]]
id = "overclock"
title = "CPU frequency"
description = "Overclocking needs Active Cooler or other good cooling."
default = "stock"
options = [
    { value = "stock", title = "2.4 GHz (stock)" },
    { value = "2600", title = "2.6 GHz" },
    { value = "2800", title = "2.8 GHz" },
]

[[variables]]
id = "serial_console"
title = "Serial console"
description = "Console on UART pins and debug connector, useful for headless setup."
type = "boolean"
default = true

[[variables]]
id = "zram"
title = "zram swap"
description = "Compressed swap in memory."
default = "2048"
options = [
    { value = "off", title = "Disabled" },
    { value = "1024", title = "1 GB" },
    { value = "2048", title = "2 GB" },
    { value = "4096", title = "4 GB" },
]

[values]
openrc = "{{ init == 'openrc' }}"
lto = "{{ optimization == 'lto' }}"
cpu_flags = "-O2 -pipe -mcpu=cortex-a76+crc+crypto -mtune=cortex-a76"
common_flags = "{{ None if optimization == 'generic' else cpu_flags + (' -flto -Werror=odr -Werror=lto-type-mismatch -Werror=strict-aliasing' if lto else '') }}"
hostname = "{{ replace(lower(project_name), ' ', '-') or 'raspberrypi' }}"
root_device = "{{ '/dev/nvme0n1p2' if boot_device == 'nvme' else '/dev/sda2' if boot_device == 'usb' else '/dev/mmcblk0p2' }}"
stage1_name = "stage1-{{ init }}"
stage4_name = "stage4-{{ init }}"
desktop_stage3_name = "stage3-desktop-{{ init }}"
desktop_stage4_name = "stage4-{{ desktop }}-{{ init }}"
desktop_profile = "default/linux/arm64/23.0/desktop/{{ desktop }}{{ '/systemd' if init == 'systemd' else '' }}"
desktop_packages = "{{ ['gnome-base/gnome', 'gnome-base/gdm'] if desktop == 'gnome' else ['kde-plasma/plasma-meta', 'x11-misc/sddm'] if desktop == 'plasma' else [] }}"
base_packages = "{{ ['app-admin/sudo', 'app-portage/gentoolkit', 'net-misc/networkmanager', 'net-misc/ntp', 'sys-power/cpupower', 'sys-kernel/raspberrypi-image'] + (['app-admin/sysklogd'] if openrc else []) + ([] if zram == 'off' else ['sys-block/zram-init']) }}"
base_services = "{{ (['cpupower|boot', 'dbus|default', 'NetworkManager|default', 'sysklogd|default', 'ntpd|default', 'ntp-client|default', 'sshd|default'] + ([] if zram == 'off' else ['zram-init|boot'])) if openrc else [] }}"

[[stages]]
id = "stage1"
name = "{{ stage1_name }}"
target = "stage1"
releng_template = "stage1-{{ init }}-23.spec"
[stages.arguments]
common_flags = "{{ common_flags }}"
catalyst_use = "{{ ['lto'] if lto else [] }}"
rel_type = "{{ '23.0-lto' if lto else '' }}"

[[stages]]
id = "stage3"
parent = "stage1"
name = "stage3-{{ init }}"
target = "stage3"
releng_template = "stage3-{{ init }}-23.spec"

[[stages]]
id = "stage4"
parent = "stage3"
name = "{{ stage4_name }}"
target = "stage4"
[stages.arguments]
stage4_use = ["networkmanager", "bluetooth"]
stage4_packages = "{{ base_packages }}"
stage4_rcadd = "{{ base_services }}"
stage4_empty = ["/var/cache/distfiles"]
stage4_rm = ["/root/.bash_history"]

[[stages]]
id = "stage3-desktop"
parent = "stage1"
name = "{{ desktop_stage3_name }}"
target = "stage3"
releng_template = "stage3d-{{ init }}-23.spec"
when = "desktop != 'none'"

[[stages]]
id = "stage4-desktop"
parent = "stage3-desktop"
name = "{{ desktop_stage4_name }}"
target = "stage4"
when = "desktop != 'none'"
[stages.arguments]
profile = { type = "PortageProfile", value = { path = "{{ desktop_profile }}", stability = "stable", repo = "gentoo" } }
version_stamp = "{{ desktop }}-{{ init }}-@TIMESTAMP@"
stage4_use = ["networkmanager", "bluetooth", "pulseaudio"]
stage4_packages = "{{ base_packages + desktop_packages }}"
stage4_rcadd = "{{ base_services + (['display-manager|default'] if openrc else []) }}"
stage4_empty = ["/var/cache/distfiles"]
stage4_rm = ["/root/.bash_history"]

# CPU features and GPU of Raspberry Pi 5, inherited by all stages (parent overlay).
[[files]]
source = "files/stage1"
destination = "stages/{{ stage1_name }}"

# Raspberry Pi kernel, firmware and boot configuration.
[[files]]
source = "files/stage4"
destination = "stages/{{ stage4_name }}"

[[files]]
source = "files/stage4"
destination = "stages/{{ desktop_stage4_name }}"
when = "desktop != 'none'"

[[files]]
source = "files/zram"
destination = "stages/{{ stage4_name }}/root_overlay"
when = "zram != 'off'"

[[files]]
source = "files/zram"
destination = "stages/{{ desktop_stage4_name }}/root_overlay"
when = "zram != 'off' and desktop != 'none'"

# Desktop: display manager and build workarounds of large packages.
[[files]]
source = "files/desktop"
destination = "stages/{{ desktop_stage4_name }}"
when = "desktop != 'none'"

[[files]]
source = "files/lto-workarounds"
destination = "stages/{{ desktop_stage4_name }}/portage"
when = "desktop != 'none' and lto"

[[groups]]
id = "wireless"
title = "Wi-Fi and Bluetooth"
description = "Firmware of wireless chip and Bluetooth service."
default = true
stages = ["stage4", "stage4-desktop"]
[groups.arguments]
stage4_packages = ["sys-firmware/raspberrypi-wifi-ucode", "net-wireless/bluez"]
stage4_rcadd = "{{ ['bluetooth|default'] if openrc else [] }}"

[[groups]]
id = "utilities"
title = "Raspberry Pi utilities"
description = "vcgencmd, pinctrl, eeprom and other tools."
default = true
stages = ["stage4", "stage4-desktop"]
[groups.arguments]
stage4_packages = ["dev-embedded/raspberrypi-utils"]

[[groups]]
id = "development"
title = "Development tools"
description = "git, eselect-repository, distcc and kernel headers."
stages = ["stage4", "stage4-desktop"]
default_stages = ["stage4"]
[groups.arguments]
stage4_packages = ["dev-vcs/git", "app-eselect/eselect-repository", "sys-devel/distcc", "sys-kernel/linux-headers"]

[[groups]]
id = "docker"
title = "Docker"
description = "Container engine, started at boot."
stages = ["stage4", "stage4-desktop"]
default_stages = ["stage4"]
[groups.arguments]
stage4_packages = ["app-containers/docker", "app-containers/docker-cli"]
stage4_rcadd = "{{ ['docker|default'] if openrc else [] }}"
