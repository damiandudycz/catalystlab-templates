format = 1
min_app_version = "0.3.0"
name = "Raspberry Pi 5"
description = "Gentoo for Raspberry Pi 5: CPU tuned stages, boot configuration, zram swap and optional GNOME and KDE Plasma desktops."
groups_title = "Software"
architecture = "arm64"

[[variables]]
id = "init"
title = "Init system"
description = "Services of stage4 are enabled automatically with OpenRC."
default = "openrc"
options = [
    { value = "openrc", title = "OpenRC" },
    { value = "systemd", title = "systemd" },
]

[[variables]]
id = "optimization"
title = "CPU optimization"
default = "tuned"
options = [
    { value = "tuned", title = "Tuned for Cortex-A76" },
    { value = "generic", title = "Generic arm64" },
]

[[variables]]
id = "lto"
title = "Link-time optimization (LTO)"
description = "Programs can be faster and smaller, but builds take longer and some packages may fail to build."
type = "boolean"
default = false

[[variables]]
id = "kernel"
title = "Kernel"
description = "Compiled kernel is built by Catalyst (kernel rpi of every stage4, genkernel) from Raspberry Pi kernel sources with bcm2712_defconfig, which takes long. Sources stay in the system, kernel can be built again on Raspberry Pi with /usr/local/sbin/build-raspberrypi-kernel."
default = "prebuilt"
options = [
    { value = "prebuilt", title = "Prebuilt (raspberrypi-image)" },
    { value = "compiled", title = "Compiled from sources (raspberrypi-sources)" },
]

[[variables]]
id = "desktop"
title = "Desktops"
description = "Every selected desktop gets its own stage4, built from desktop stage3 next to the console stage4."
type = "multiple"
options = [
    { value = "gnome", title = "GNOME" },
    { value = "plasma", title = "KDE Plasma" },
]

[[variables]]
id = "overclock"
title = "CPU frequency"
description = "Overclocking needs Active Cooler or other good cooling."
default = "stock"
options = [
    { value = "stock", title = "2.4 GHz (stock)" },
    { value = "2600", title = "2.6 GHz" },
    { value = "2800", title = "2.8 GHz" },
]

[[variables]]
id = "serial_console"
title = "Serial console"
description = "Console on UART pins and debug connector, useful for headless setup."
type = "boolean"
default = true

[[variables]]
id = "iso"
title = "Installation ISO (experimental)"
description = "Live ISO with installation tools and Raspberry Pi kernel compiled from sources (bcm2712_defconfig), built from console stage3. Raspberry Pi firmware doesn't boot ISO images directly, the ISO is for testing."
type = "boolean"
default = false
when = "init == 'openrc'"

[[variables]]
id = "zram"
title = "zram swap"
description = "Compressed swap in memory."
default = "2048"
options = [
    { value = "off", title = "Disabled" },
    { value = "1024", title = "1 GB" },
    { value = "2048", title = "2 GB" },
    { value = "4096", title = "4 GB" },
]

[values]
openrc = "{{ init == 'openrc' }}"
tuned = "{{ optimization == 'tuned' }}"
cpu_flags = "{{ '-O2 -pipe -mcpu=cortex-a76+crc+crypto -mtune=cortex-a76' if tuned else '-O2 -pipe' }}"
# Release type names optimizations (eg. 23.0-cortex-a76-lto), generic stages use 23.0-default of releng specs.
optimizations = "{{ (['cortex-a76'] if tuned else []) + (['lto'] if lto else []) }}"
rel_type = "{{ '23.0-' + join('-', optimizations) if optimizations else '' }}"
common_flags = "{{ cpu_flags + (' -flto -Werror=odr -Werror=lto-type-mismatch -Werror=strict-aliasing' if lto else '') if tuned or lto else None }}"
hostname = "{{ replace(lower(project_name), ' ', '-') or 'raspberrypi' }}"
stage1_name = "stage1-{{ init }}"
stage4_name = "stage4-{{ init }}"
with_desktop = "{{ desktop != [] }}"
desktop_stage3_name = "stage3-desktop-{{ init }}"
iso_stage1_name = "livecd-stage1-{{ init }}"
iso_stage2_name = "livecd-stage2-{{ init }}"
# Installation tools of minimal installation ISO of Gentoo releases.
iso_packages = "{{ ['app-portage/gentoolkit', 'net-misc/ntp', 'net-misc/networkmanager', 'app-accessibility/brltty', 'app-admin/pwgen', 'app-arch/lbzip2', 'app-arch/pigz', 'app-arch/zstd', 'app-crypt/gnupg', 'app-misc/livecd-tools', 'app-portage/mirrorselect', 'app-shells/bash-completion', 'app-shells/gentoo-bashcomp', 'net-analyzer/tcptraceroute', 'net-analyzer/traceroute', 'net-misc/dhcpcd', 'net-misc/iputils', 'net-misc/openssh', 'net-misc/rdate', 'net-wireless/iw', 'net-wireless/iwd', 'net-wireless/wireless-tools', 'net-wireless/wpa_supplicant', 'sys-apps/busybox', 'sys-apps/ethtool', 'sys-apps/gptfdisk', 'sys-apps/hdparm', 'sys-apps/iproute2', 'sys-apps/memtester', 'sys-apps/sdparm', 'sys-apps/usbutils', 'sys-auth/ssh-import-id', 'sys-block/parted', 'sys-fs/btrfs-progs', 'sys-fs/cryptsetup', 'sys-fs/dosfstools', 'sys-fs/e2fsprogs', 'sys-fs/f2fs-tools', 'sys-fs/lsscsi', 'sys-fs/sysfsutils', 'sys-fs/xfsprogs', 'sys-libs/gpm', 'sys-process/lsof', 'www-client/links', 'sys-devel/bc', 'sys-devel/bison', 'sys-devel/flex'] + ([] if zram == 'off' else ['sys-block/zram-init']) }}"
iso_services = "{{ ([] if zram == 'off' else ['zram-init|boot']) + ['NetworkManager|default', 'ntpd|default', 'ntp-client|default'] }}"
gnome_stage4_name = "stage4-gnome-{{ init }}"
plasma_stage4_name = "stage4-plasma-{{ init }}"
desktop_profile_suffix = "{{ '/systemd' if init == 'systemd' else '' }}"
compiled_kernel = "{{ kernel == 'compiled' }}"
# Compiled kernel is built by catalyst from its sources (kernel rpi), it needs tools to build them (not in stage3).
kernel_packages = "{{ ['sys-devel/bc', 'sys-devel/bison', 'sys-devel/flex'] if compiled_kernel else ['sys-kernel/raspberrypi-image'] }}"
# Installs built kernel for firmware (kernel_2712.img, device trees, overlays) and keeps its sources in world.
kernel_fsscript = "{{ '@STAGE_DIR@/install-kernel.sh' if compiled_kernel else None }}"
base_packages = "{{ ['app-admin/sudo', 'app-portage/gentoolkit', 'net-misc/networkmanager', 'net-misc/ntp', 'sys-power/cpupower'] + kernel_packages + (['app-admin/sysklogd'] if openrc else []) + ([] if zram == 'off' else ['sys-block/zram-init']) }}"
base_services = "{{ (['cpupower|boot', 'dbus|default', 'NetworkManager|default', 'sysklogd|default', 'ntpd|default', 'ntp-client|default', 'sshd|default'] + ([] if zram == 'off' else ['zram-init|boot'])) if openrc else [] }}"

[[stages]]
id = "stage1"
name = "{{ stage1_name }}"
target = "stage1"
releng_template = "stage1-{{ init }}-23.spec"
[stages.arguments]
common_flags = "{{ common_flags }}"
catalyst_use = "{{ ['lto'] if lto else [] }}"
rel_type = "{{ rel_type }}"

[[stages]]
id = "stage3"
parent = "stage1"
name = "stage3-{{ init }}"
target = "stage3"
releng_template = "stage3-{{ init }}-23.spec"

[[stages]]
id = "stage4"
parent = "stage3"
name = "{{ stage4_name }}"
target = "stage4"
[stages.arguments]
stage4_use = ["networkmanager", "bluetooth"]
stage4_packages = "{{ base_packages }}"
stage4_rcadd = "{{ base_services }}"
stage4_empty = ["/var/cache/distfiles"]
stage4_fsscript = "{{ kernel_fsscript }}"
boot_kernel = "{{ ['rpi'] if compiled_kernel else [] }}"
stage4_rm = ["/root/.bash_history"]
[stages.arguments.boot_kernels.rpi]
sources = "{{ 'sys-kernel/raspberrypi-sources' if compiled_kernel else '' }}"
config = "{{ '@STAGE_DIR@/kernel.config' if compiled_kernel else '' }}"

[[stages]]
id = "stage3-desktop"
parent = "stage1"
name = "{{ desktop_stage3_name }}"
target = "stage3"
releng_template = "stage3d-{{ init }}-23.spec"
when = "with_desktop"

[[stages]]
id = "stage4-gnome"
parent = "stage3-desktop"
name = "{{ gnome_stage4_name }}"
target = "stage4"
when = "'gnome' in desktop"
[stages.arguments]
profile = { type = "PortageProfile", value = { path = "default/linux/arm64/23.0/desktop/gnome{{ desktop_profile_suffix }}", stability = "stable", repo = "gentoo" } }
version_stamp = "gnome-{{ init }}-@TIMESTAMP@"
stage4_use = ["networkmanager", "bluetooth", "pulseaudio"]
stage4_packages = "{{ base_packages + ['gnome-base/gnome', 'gnome-base/gdm'] }}"
stage4_rcadd = "{{ base_services + (['display-manager|default'] if openrc else []) }}"
stage4_empty = ["/var/cache/distfiles"]
stage4_fsscript = "{{ kernel_fsscript }}"
boot_kernel = "{{ ['rpi'] if compiled_kernel else [] }}"
stage4_rm = ["/root/.bash_history"]
[stages.arguments.boot_kernels.rpi]
sources = "{{ 'sys-kernel/raspberrypi-sources' if compiled_kernel else '' }}"
config = "{{ '@STAGE_DIR@/kernel.config' if compiled_kernel else '' }}"

[[stages]]
id = "stage4-plasma"
parent = "stage3-desktop"
name = "{{ plasma_stage4_name }}"
target = "stage4"
when = "'plasma' in desktop"
[stages.arguments]
profile = { type = "PortageProfile", value = { path = "default/linux/arm64/23.0/desktop/plasma{{ desktop_profile_suffix }}", stability = "stable", repo = "gentoo" } }
version_stamp = "plasma-{{ init }}-@TIMESTAMP@"
stage4_use = ["networkmanager", "bluetooth", "pulseaudio"]
stage4_packages = "{{ base_packages + ['kde-plasma/plasma-meta', 'x11-misc/sddm'] }}"
stage4_rcadd = "{{ base_services + (['display-manager|default'] if openrc else []) }}"
stage4_empty = ["/var/cache/distfiles"]
stage4_fsscript = "{{ kernel_fsscript }}"
boot_kernel = "{{ ['rpi'] if compiled_kernel else [] }}"
stage4_rm = ["/root/.bash_history"]
[stages.arguments.boot_kernels.rpi]
sources = "{{ 'sys-kernel/raspberrypi-sources' if compiled_kernel else '' }}"
config = "{{ '@STAGE_DIR@/kernel.config' if compiled_kernel else '' }}"

# Installation ISO (experimental): live system with Raspberry Pi kernel compiled by catalyst (kernel rpi, genkernel,
# bcm2712_defconfig) and installation tools. Raspberry Pi firmware boots kernel from FAT partition, not from ISO images.
[[stages]]
id = "livecd-stage1"
parent = "stage3"
name = "{{ iso_stage1_name }}"
target = "livecd_stage1"
when = "iso"
[stages.arguments]
livecd_use = ["compile-locales", "fbcon", "socks5", "unicode", "xml"]
livecd_packages = "{{ iso_packages }}"

[[stages]]
id = "livecd-stage2"
parent = "livecd-stage1"
name = "{{ iso_stage2_name }}"
target = "livecd_stage2"
when = "iso"
[stages.arguments]
boot_kernel = ["rpi"]
livecd_type = "gentoo-release-minimal"
livecd_fstype = "squashfs"
livecd_volid = "Gentoo-rpi5"
livecd_iso = "install-rpi5-@TIMESTAMP@.iso"
livecd_rcadd = "{{ iso_services }}"
livecd_unmerge = ["app-portage/gentoolkit", "app-admin/eselect", "app-admin/eselect-ctags", "app-admin/eselect-vi", "app-admin/perl-cleaner", "app-admin/python-updater", "app-arch/cpio", "dev-libs/gmp", "dev-libs/libxml2", "dev-libs/mpfr", "dev-python/pycrypto", "dev-util/pkgconfig", "dev-util/pkgconf", "perl-core/PodParser", "perl-core/Test-Harness", "sys-apps/debianutils", "sys-apps/diffutils", "sys-apps/groff", "sys-apps/man-db", "sys-apps/man-pages", "sys-apps/miscfiles", "sys-apps/sandbox", "sys-apps/texinfo", "sys-devel/autoconf", "sys-devel/autoconf-wrapper", "sys-devel/automake", "sys-devel/automake-wrapper", "sys-devel/binutils", "sys-devel/binutils-config", "sys-devel/bison", "sys-devel/flex", "sys-devel/gcc", "sys-devel/gcc-config", "sys-devel/gettext", "sys-devel/gnuconfig", "sys-devel/libtool", "sys-devel/m4", "sys-devel/make", "sys-devel/patch", "sys-libs/db", "sys-libs/gdbm", "sys-kernel/genkernel", "sys-kernel/linux-headers"]
livecd_empty = ["/boot", "/etc/cron.daily", "/etc/cron.hourly", "/etc/cron.monthly", "/etc/cron.weekly", "/etc/logrotate.d", "/etc/modules.autoload.d", "/etc/rsync", "/etc/runlevels/single", "/etc/skel", "/usr/lib/dev-state", "/usr/lib/udev-state", "/usr/lib64/dev-state", "/usr/lib64/udev-state", "/root/.ccache", "/tmp", "/usr/include", "/usr/lib64/X11/config", "/usr/lib64/X11/doc", "/usr/lib64/X11/etc", "/usr/lib64/awk", "/usr/lib64/ccache", "/usr/lib64/gcc-config", "/usr/lib64/nfs", "/usr/lib64/perl5/site_perl", "/usr/lib64/portage", "/usr/local", "/usr/portage", "/usr/aarch64*-unknown-linux-gnu", "/usr/share/aclocal", "/usr/share/baselayout", "/usr/share/binutils-data", "/usr/share/consolefonts/partialfonts", "/usr/share/consoletrans", "/usr/share/dict", "/usr/share/doc", "/usr/share/emacs", "/usr/share/et", "/usr/share/gcc-data", "/usr/share/genkernel", "/usr/share/gettext", "/usr/share/glib-2.0", "/usr/share/gnuconfig", "/usr/share/gtk-doc", "/usr/share/i18n", "/usr/share/info", "/usr/share/lcms", "/usr/share/libtool", "/usr/share/locale", "/usr/share/man", "/usr/share/rfc", "/usr/share/ss", "/usr/share/state", "/usr/share/texinfo", "/usr/share/unimaps", "/usr/share/zoneinfo", "/usr/src", "/var/cache", "/var/empty", "/var/lib/portage", "/var/log", "/var/spool", "/var/state", "/var/tmp"]
livecd_rm = ["/boot/System*", "/boot/initr*", "/boot/kernel*", "/etc/*-", "/etc/*.old", "/etc/default/audioctl", "/etc/dispatch-conf.conf", "/etc/env.d/05binutils", "/etc/env.d/05gcc", "/etc/etc-update.conf", "/etc/hosts.bck", "/etc/issue*", "/etc/genkernel.conf", "/etc/make.conf*", "/etc/make.globals", "/etc/make.profile", "/etc/man.conf", "/etc/resolv.conf", "/usr/lib*/*.a", "/usr/lib*/*.la", "/usr/lib*/cpp", "/root/.bash_history", "/root/.viminfo", "/usr/bin/*.static", "/usr/bin/fsck.cramfs", "/usr/bin/fsck.minix", "/usr/bin/mkfs.bfs", "/usr/bin/mkfs.cramfs", "/usr/bin/mkfs.minix", "/usr/bin/addr2line", "/usr/bin/ar", "/usr/bin/as", "/usr/bin/audioctl", "/usr/bin/c++*", "/usr/bin/cc", "/usr/bin/cjpeg", "/usr/bin/cpp", "/usr/bin/djpeg", "/usr/bin/ebuild", "/usr/bin/egencache", "/usr/bin/emerge", "/usr/bin/emerge-webrsync", "/usr/bin/emirrordist", "/usr/bin/elftoaout", "/usr/bin/f77", "/usr/bin/g++*", "/usr/bin/g77", "/usr/bin/gcc*", "/usr/bin/genkernel", "/usr/bin/gprof", "/usr/bin/jpegtran", "/usr/bin/ld", "/usr/bin/libpng*", "/usr/bin/nm", "/usr/bin/objcopy", "/usr/bin/objdump", "/usr/bin/piggyback*", "/usr/bin/portageq", "/usr/bin/ranlib", "/usr/bin/readelf", "/usr/bin/size", "/usr/bin/aarch64*-unknown-linux-gnu-*", "/usr/bin/strings", "/usr/bin/strip", "/usr/bin/tbz2tool", "/usr/bin/xpak", "/usr/bin/yacc", "/usr/lib*/perl5/site_perl", "/usr/lib*/gcc-lib/*/*/libgcj*", "/usr/bin/archive-conf", "/usr/bin/dispatch-conf", "/usr/bin/emaint", "/usr/bin/env-update", "/usr/bin/etc-update", "/usr/bin/fb*", "/usr/bin/fixpackages", "/usr/bin/quickpkg", "/usr/bin/regenworld", "/usr/share/consolefonts/1*", "/usr/share/consolefonts/7*", "/usr/share/consolefonts/8*", "/usr/share/consolefonts/9*", "/usr/share/consolefonts/A*", "/usr/share/consolefonts/C*", "/usr/share/consolefonts/E*", "/usr/share/consolefonts/G*", "/usr/share/consolefonts/L*", "/usr/share/consolefonts/M*", "/usr/share/consolefonts/R*", "/usr/share/consolefonts/a*", "/usr/share/consolefonts/c*", "/usr/share/consolefonts/dr*", "/usr/share/consolefonts/g*", "/usr/share/consolefonts/i*", "/usr/share/consolefonts/k*", "/usr/share/consolefonts/l*", "/usr/share/consolefonts/r*", "/usr/share/consolefonts/s*", "/usr/share/consolefonts/t*", "/usr/share/consolefonts/v*", "/usr/share/misc/*.old"]
[stages.arguments.boot_kernels.rpi]
sources = "sys-kernel/raspberrypi-sources"
config = "@STAGE_DIR@/kernel.config"

# CPU features and GPU of Raspberry Pi 5, inherited by all stages (parent overlay).
[[files]]
source = "files/stage1"
destination = "stages/{{ stage1_name }}"

# Compiled kernel: configuration, script installing it for firmware (run by catalyst in every stage4) and sources
# allowed from testing branch (~arm64); script building kernel again installed in system.
[[files]]
source = "files/kernel-sources"
destination = "stages/{{ stage4_name }}"
when = "compiled_kernel"

[[files]]
source = "files/kernel-rebuild/build-kernel.sh"
destination = "stages/{{ stage4_name }}/root_overlay/usr/local/sbin/build-raspberrypi-kernel"
when = "compiled_kernel"

[[files]]
source = "files/kernel-sources"
destination = "stages/{{ gnome_stage4_name }}"
when = "compiled_kernel and 'gnome' in desktop"

[[files]]
source = "files/kernel-rebuild/build-kernel.sh"
destination = "stages/{{ gnome_stage4_name }}/root_overlay/usr/local/sbin/build-raspberrypi-kernel"
when = "compiled_kernel and 'gnome' in desktop"

[[files]]
source = "files/kernel-sources"
destination = "stages/{{ plasma_stage4_name }}"
when = "compiled_kernel and 'plasma' in desktop"

[[files]]
source = "files/kernel-rebuild/build-kernel.sh"
destination = "stages/{{ plasma_stage4_name }}/root_overlay/usr/local/sbin/build-raspberrypi-kernel"
when = "compiled_kernel and 'plasma' in desktop"

# Raspberry Pi kernel, firmware and boot configuration.
[[files]]
source = "files/stage4"
destination = "stages/{{ stage4_name }}"

[[files]]
source = "files/zram"
destination = "stages/{{ stage4_name }}/root_overlay"
when = "zram != 'off'"

# Desktops: the same as console stage4, with display manager and build workarounds of large packages.
[[files]]
source = "files/stage4"
destination = "stages/{{ gnome_stage4_name }}"
when = "'gnome' in desktop"

[[files]]
source = "files/zram"
destination = "stages/{{ gnome_stage4_name }}/root_overlay"
when = "zram != 'off' and 'gnome' in desktop"

[[files]]
source = "files/desktop"
destination = "stages/{{ gnome_stage4_name }}"
when = "'gnome' in desktop"

[[files]]
source = "files/desktop-gnome"
destination = "stages/{{ gnome_stage4_name }}"
when = "'gnome' in desktop"

[[files]]
source = "files/lto-workarounds"
destination = "stages/{{ gnome_stage4_name }}/portage"
when = "'gnome' in desktop and lto"

[[files]]
source = "files/lto-workarounds-tuned"
destination = "stages/{{ gnome_stage4_name }}/portage"
when = "'gnome' in desktop and lto and tuned"

[[files]]
source = "files/stage4"
destination = "stages/{{ plasma_stage4_name }}"
when = "'plasma' in desktop"

[[files]]
source = "files/zram"
destination = "stages/{{ plasma_stage4_name }}/root_overlay"
when = "zram != 'off' and 'plasma' in desktop"

[[files]]
source = "files/desktop"
destination = "stages/{{ plasma_stage4_name }}"
when = "'plasma' in desktop"

[[files]]
source = "files/desktop-plasma"
destination = "stages/{{ plasma_stage4_name }}"
when = "'plasma' in desktop"

[[files]]
source = "files/lto-workarounds"
destination = "stages/{{ plasma_stage4_name }}/portage"
when = "'plasma' in desktop and lto"

[[files]]
source = "files/lto-workarounds-tuned"
destination = "stages/{{ plasma_stage4_name }}/portage"
when = "'plasma' in desktop and lto and tuned"

[[groups]]
id = "wireless"
title = "Wi-Fi and Bluetooth"
description = "Firmware of wireless chip and Bluetooth service."
default = true
stages = ["stage4", "stage4-gnome", "stage4-plasma"]
[groups.arguments]
stage4_packages = ["sys-firmware/raspberrypi-wifi-ucode", "net-wireless/bluez"]
stage4_rcadd = "{{ ['bluetooth|default'] if openrc else [] }}"

[[groups]]
id = "utilities"
title = "Raspberry Pi utilities"
description = "vcgencmd, pinctrl, eeprom and other tools."
default = true
stages = ["stage4", "stage4-gnome", "stage4-plasma"]
[groups.arguments]
stage4_packages = ["dev-embedded/raspberrypi-utils"]

[[groups]]
id = "development"
title = "Development tools"
description = "git, eselect-repository, distcc and kernel headers."
stages = ["stage4", "stage4-gnome", "stage4-plasma"]
[groups.arguments]
stage4_packages = ["dev-vcs/git", "app-eselect/eselect-repository", "sys-devel/distcc", "sys-kernel/linux-headers"]

[[groups]]
id = "docker"
title = "Docker"
description = "Container engine, started at boot."
stages = ["stage4", "stage4-gnome", "stage4-plasma"]
[groups.arguments]
stage4_packages = ["app-containers/docker", "app-containers/docker-cli"]
stage4_rcadd = "{{ ['docker|default'] if openrc else [] }}"

# Installation ISO: Raspberry Pi devices in both stages, kernel configuration and sources (with genkernel without
# firmware) in stage2, zram of live system.
[[files]]
source = "files/stage4/portage"
destination = "stages/{{ iso_stage1_name }}/portage"
when = "iso"

[[files]]
source = "files/stage4/portage"
destination = "stages/{{ iso_stage2_name }}/portage"
when = "iso"

[[files]]
source = "files/kernel-sources/kernel.config"
destination = "stages/{{ iso_stage2_name }}/kernel.config"
when = "iso"

[[files]]
source = "files/kernel-sources/portage"
destination = "stages/{{ iso_stage2_name }}/portage"
when = "iso"

[[files]]
source = "files/zram"
destination = "stages/{{ iso_stage2_name }}/root_overlay"
when = "iso and zram != 'off'"
